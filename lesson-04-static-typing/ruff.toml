# Устанавливаем максимально допустимую длину строки —
# 88 символов, как это делает форматтер black (удобно для split-view и терминала)
line-length = 88

# Указываем целевую версию Python — важно для правильной работы ренеймера, парсера и проверки синтаксиса
target-version = "py311"

# Используем пробелы для отступов (по умолчанию, но фиксируем явно)
indent-width = 4

[lint]
# Выбираем набор правил для анализа кода:
# E — ошибки стиля (pycodestyle)
# F — ошибки, связанные с переменными, импортами и т. д. (pyflakes)
# I — сортировка импортов (аналог isort)
# B — best practices из flake8-bugbear
select = ["E", "F", "I", "B"]


# Разрешаем автоисправление только безопасных вещей
fixable = ["E", "F", "I"]

# Не пытаемся «чинить» потенциально опасные правила
unfixable = ["B"]

[format]
# 🔹 Сохраняем существующий стиль кавычек
quote-style = "preserve"

# 🔹 Используем пробелы (не табы)
indent-style = "space"

# 🔹 Корректно обрабатываем окончания строк (LF / CRLF)
line-ending = "auto"

# 🔹 НЕ отключаем magic trailing comma
skip-magic-trailing-comma = false



