[project]
name = "lesson3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pandas",
  "numpy",
  "joblib",
  "scikit-learn"
]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]


[tool.mypy]
python_version = "3.10"
# Требует аннотации для всех функций
disallow_untyped_defs = true
# Предупреждает, если функция может вернуть Any
warn_return_any = true
# Игнорирует библиотеки без типов (например, старые или научные)
ignore_missing_imports = true